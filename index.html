    <!-- Boot loader: painted before any script arrives, then handed over to
         the app's own loader (RouteLoader), which removes it. -->
    <style>
      #boot-loader {
        position: fixed;
        inset: 0;
        z-index: 71;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: #f7f8fa;
        font-family: "Open Sans", system-ui, sans-serif;
      }
      #boot-loader .bm { width: 60px; height: 60px; animation: bbeat 1.8s ease-out infinite; }
      #boot-loader .bl { margin-top: 28px; width: 260px; height: 40px; overflow: visible; }
      #boot-loader .bt { stroke-dasharray: 1; stroke-dashoffset: 1; animation: btrace 1.8s linear infinite; }
      #boot-loader .bw { margin-top: 24px; font-size: 17px; font-weight: 700; letter-spacing: -0.02em; }
      #boot-loader .bs { margin-top: 4px; font-size: 11.5px; font-weight: 700; letter-spacing: 0.22em; text-transform: uppercase; color: #6b7280; }
      @keyframes btrace { 0% { stroke-dashoffset: 1; opacity: 1 } 70% { stroke-dashoffset: 0; opacity: 1 } 100% { stroke-dashoffset: 0; opacity: 0 } }
      @keyframes bbeat { 0%, 26% { transform: scale(1) } 32% { transform: scale(1.16) } 37% { transform: scale(.98) } 42% { transform: scale(1.07) } 52%, 100% { transform: scale(1) } }
      @media (prefers-reduced-motion: reduce) { #boot-loader { display: none } }
    </style>
  </head>
